<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>N4 漢字 Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Klee+One:wght@400;600&family=Noto+Serif+JP:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16161F; --paper:#FBF7F0; --card:#FFFFFF;
  --teal:#0FA3A3; --teal-deep:#0B7C7C; --teal-lt:#4FC3BD;
  --crimson:#E23D4E; --orange:#F59E0B; --gray:#C4C9CF; --gray-dk:#8B929B;
  --gold:#D4A017;
  --grad:linear-gradient(135deg,#FFD6E0 0%,#BFD9FF 100%);
  --grad2:linear-gradient(135deg,#FFE9EF 0%,#DCEBFF 100%);
  --sans:'Outfit','Avenir Next','Segoe UI','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
  --jp:'Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  --jpserif:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','MS Mincho',serif;
  --f-gothic:'Hiragino Sans','Yu Gothic Medium','Yu Gothic','Meiryo','Noto Sans JP',sans-serif;
  --f-mincho:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP','MS Mincho',serif;
  --f-kyokasho:'Klee One','YuKyokasho','YuKyokasho Yoko','UD デジタル 教科書体 N-R','UD Digital Kyokasho N-R','Hiragino Mincho ProN',serif;
  --glyphfont:var(--f-gothic);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);line-height:1.5;padding-bottom:84px;
  background-image:radial-gradient(rgba(22,22,31,.045) 1px,transparent 1px);background-size:22px 22px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
#app{max-width:720px;margin:0 auto;padding:16px 14px 24px}
.jp{font-family:var(--jp)}

/* ---------- Panels: thick ink borders + offset shadows ---------- */
.panel{background:var(--card);border:3px solid var(--ink);border-radius:14px;
  box-shadow:5px 5px 0 var(--teal);padding:16px;margin-bottom:18px}
.panel.crim{box-shadow:5px 5px 0 var(--crimson)}
.panel.grad{background:var(--grad)}
.panel.flat{box-shadow:none}
.tile{display:block;width:100%;text-align:left;background:var(--grad);border:3px solid var(--ink);
  border-radius:14px;box-shadow:5px 5px 0 var(--teal);padding:16px;margin-bottom:16px;
  transition:transform .08s,box-shadow .08s}
.tile:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--teal)}
.tile.crim{box-shadow:5px 5px 0 var(--crimson)}
.tile.crim:active{box-shadow:2px 2px 0 var(--crimson)}
.tile h3{font-size:1.05rem;font-weight:800;letter-spacing:.01em}
.tile .sub{font-size:.82rem;color:#3A3A46;margin-top:2px}

/* ---------- Type ---------- */
h1{font-size:1.5rem;font-weight:900;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:800;margin-bottom:10px}
.eyebrow{font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--crimson)}
.muted{color:#6A6F78;font-size:.85rem}
.small{font-size:.8rem}

/* ---------- Header ---------- */
.apphead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.apphead .brand{display:flex;align-items:baseline;gap:8px}
.apphead .brand .n4{background:var(--ink);color:#fff;border-radius:8px;padding:2px 8px;font-weight:900;font-size:1.05rem}
.backbtn{font-weight:800;font-size:.9rem;border:3px solid var(--ink);border-radius:10px;padding:6px 12px;
  background:#fff;box-shadow:3px 3px 0 var(--ink)}
.backbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}

/* ---------- Bottom nav ---------- */
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--ink);
  display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.68rem;font-weight:700;
  color:var(--gray-dk);padding:4px 10px;border-radius:10px}
nav button .ic{font-size:1.25rem;line-height:1.2;font-family:var(--jp)}
nav button.on{color:var(--ink);background:var(--grad2);border:2px solid var(--ink)}

/* ---------- Depth colors ---------- */
.d0{background:var(--gray)} .d1{background:var(--orange)} .d2{background:var(--teal-lt)}
.d3{background:var(--teal)} .d4{background:var(--teal-deep)} .d5{background:var(--gold)}
.t0{color:var(--gray-dk)} .t1{color:var(--orange)} .t2{color:var(--teal-lt)}
.t3{color:var(--teal)} .t4{color:var(--teal-deep)} .t5{color:var(--gold)}

/* ---------- Stacked horizontal bar ---------- */
.stackbar{display:flex;height:22px;border:3px solid var(--ink);border-radius:9px;overflow:hidden;background:#fff}
.stackbar div{height:100%}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:8px;font-size:.72rem;font-weight:700}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border:2px solid var(--ink);border-radius:4px;display:inline-block}

/* ---------- Kanji browse grid ---------- */
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.kcell{position:relative;aspect-ratio:1;border:3px solid var(--ink);border-radius:12px;background:#fff;
  font-family:var(--glyphfont);font-size:1.7rem;display:flex;align-items:center;justify-content:center;
  box-shadow:3px 3px 0 var(--ink)}
.kcell:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.kcell .dot{position:absolute;top:5px;right:5px;width:11px;height:11px;border:2px solid var(--ink);border-radius:50%}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:.78rem;font-weight:800;background:#fff}
.chip.on{background:var(--ink);color:#fff}
.search{width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;font-size:1rem;
  font-family:var(--sans);background:#fff;margin-bottom:12px;box-shadow:3px 3px 0 var(--teal)}
.search:focus{outline:3px solid var(--crimson);outline-offset:2px}

/* ---------- Kanji detail hero ---------- */
.hero{position:relative;background:var(--grad);border:3px solid var(--ink);border-radius:18px;
  box-shadow:6px 6px 0 var(--crimson),12px 12px 0 var(--teal);padding:26px 16px 20px;margin:4px 8px 30px 0;text-align:center}
.hero .glyph{cursor:pointer;font-family:var(--glyphfont);font-size:min(38vw,170px);line-height:1.05;font-weight:600}
.hero .gloss{font-size:1.15rem;font-weight:800;margin-top:2px}
.ringwrap{position:absolute;top:12px;right:12px;width:56px;height:56px}
.ringwrap svg{width:56px;height:56px}
.ringwrap .dnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:1.05rem}
.readrow{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.readpill{cursor:pointer;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:5px 14px;font-weight:700;
  font-family:var(--jp);font-size:.95rem}
.readpill b{font-size:.66rem;font-weight:900;letter-spacing:.08em;margin-right:6px;color:var(--crimson)}
.readpill.kun b{color:var(--teal-deep)}
.readpill .oku{color:var(--gray-dk)}

.fontrow{display:flex;gap:8px;justify-content:center;margin-top:14px}
.fontrow .chip{font-size:.72rem;padding:5px 10px}
.fontrow .chip small{display:block;font-size:.58rem;font-weight:700;opacity:.75}

/* ---------- Detail sections ---------- */
.sect{margin-bottom:18px}
.sect .shead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sect .shead .sjp{font-family:var(--jp);font-weight:800;background:var(--ink);color:#fff;border-radius:8px;
  padding:2px 9px;font-size:.85rem}
.sect .shead .sen{font-weight:800;font-size:.95rem}
.comp{display:flex;gap:10px;flex-wrap:wrap}
.comp .c{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:8px 12px;text-align:center;min-width:74px}
.comp .c .cc{font-family:var(--glyphfont);font-size:1.9rem;line-height:1.2}
.comp .c .cn{font-size:.7rem;font-weight:700;color:#555C66;margin-top:2px}
.comp .c.rad{background:var(--grad2)}
.comp .c.rad .tag{font-size:.6rem;font-weight:900;letter-spacing:.1em;color:var(--crimson)}
.vlist .v{cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 2px;
  border-bottom:2px dashed #D8D3C8}
.vlist .v:last-child{border-bottom:none}
.vlist .vw{font-family:var(--jp);font-size:1.2rem;font-weight:600}
.vlist .vr{font-family:var(--jp);color:var(--teal-deep);font-weight:600;font-size:.9rem}
.vlist .vg{color:#555C66;font-size:.85rem;text-align:right;flex:1}
.simrow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed #D8D3C8}
.simrow:last-child{border-bottom:none}
.simrow .sk{font-family:var(--glyphfont);font-size:2.1rem;line-height:1.15;min-width:52px;text-align:center;
  border:3px solid var(--ink);border-radius:12px;background:#fff;padding:4px 6px}
.simrow .sn{font-size:.85rem;padding-top:2px}
.simrow .sn .lvl{font-size:.62rem;font-weight:900;color:var(--crimson);letter-spacing:.08em}
.sentbox{font-family:var(--jp);font-size:1.15rem;line-height:2.3;background:#fff;border:3px solid var(--ink);
  border-radius:12px;padding:14px}
.sentbox .en{display:block;font-family:var(--sans);font-size:.85rem;color:#555C66;line-height:1.4;margin-top:8px;
  border-top:2px dashed #D8D3C8;padding-top:8px}
ruby rt{font-size:.55em;color:var(--crimson);font-weight:600;opacity:0;transition:opacity .12s}
ruby.show rt{opacity:1}
.w{border-bottom:3px solid var(--teal-lt);padding-bottom:1px}
.skillbars .sb{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.skillbars .sb .lbl{width:74px;font-size:.75rem;font-weight:800}
.skillbars .sb .track{flex:1;height:14px;border:2.5px solid var(--ink);border-radius:7px;background:#fff;overflow:hidden}
.skillbars .sb .fill{height:100%}
.skillbars .sb .pct{width:40px;text-align:right;font-size:.72rem;font-weight:800;color:#555C66}
.etybox{background:#fff;border:3px solid var(--ink);border-radius:12px;padding:14px;font-size:.92rem}
.etybox .etype{display:inline-block;font-size:.66rem;font-weight:900;letter-spacing:.1em;background:var(--grad);
  border:2px solid var(--ink);border-radius:6px;padding:2px 8px;margin-bottom:8px}
.mnbox{background:var(--grad2);border:3px solid var(--ink);border-radius:12px;padding:12px 14px;font-size:.92rem;margin-top:10px}
.mnbox b{color:var(--crimson)}

/* ---------- Buttons ---------- */
.bigbtn{display:block;width:100%;text-align:center;font-weight:900;font-size:1rem;border:3px solid var(--ink);
  border-radius:14px;padding:14px;background:var(--ink);color:#fff;box-shadow:5px 5px 0 var(--crimson);margin-bottom:14px}
.bigbtn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--crimson)}
.bigbtn.ghost{background:#fff;color:var(--ink);box-shadow:5px 5px 0 var(--teal)}
.bigbtn.ghost:active{box-shadow:2px 2px 0 var(--teal)}
.btnrow{display:flex;gap:12px}
.btnrow .bigbtn{flex:1}

/* ---------- Flashcards ---------- */
.fcard{background:#fff;border:3px solid var(--ink);border-radius:18px;box-shadow:6px 6px 0 var(--teal);
  min-height:320px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 16px;margin-bottom:18px;text-align:center}
.fcard .big{font-family:var(--glyphfont);font-size:min(30vw,120px);line-height:1.1}
.fcard .prompt{font-size:.78rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--gray-dk);margin-bottom:10px}
.fcard .ans{margin-top:14px;border-top:3px dashed #D8D3C8;padding-top:14px;width:100%}
.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade button{border:3px solid var(--ink);border-radius:12px;padding:12px 4px;font-weight:900;font-size:.82rem;
  background:#fff;box-shadow:3px 3px 0 var(--ink)}
.grade button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.grade .g0{background:#FADBD8}.grade .g1{background:#FDEBD0}.grade .g2{background:#D6F5F0}.grade .g3{background:#FDF3D0}
.grade button i{display:block;font-style:normal;font-size:.62rem;font-weight:700;color:#555C66;margin-top:2px}
.sessionbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:800;font-size:.85rem}
.progress{flex:1;height:14px;border:3px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden;margin:0 12px}
.progress div{height:100%;background:var(--teal)}

/* ---------- Quiz ---------- */
.qprompt{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--crimson);
  padding:20px 16px;text-align:center;margin-bottom:16px}
.qprompt .qbig{font-family:var(--glyphfont);font-size:4rem;line-height:1.15}
.qprompt .qword{font-family:var(--jp);font-size:2rem;font-weight:600}
.qprompt .qtext{font-size:1rem;font-weight:700}
.qprompt .qsent{font-family:var(--jp);font-size:1.15rem;line-height:2;text-align:left}
.qprompt .qsub{font-size:.78rem;font-weight:700;color:var(--gray-dk);margin-top:6px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:13px 12px;font-weight:700;font-size:1rem;
  box-shadow:3px 3px 0 var(--ink);text-align:center}
.opt.jpop{font-family:var(--jp);font-size:1.2rem}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.right{background:#D6F5F0;border-color:var(--teal-deep);box-shadow:3px 3px 0 var(--teal-deep)}
.opt.wrong{background:#FADBD8;border-color:var(--crimson);box-shadow:3px 3px 0 var(--crimson)}
.opt.dim{opacity:.45}
.feedback{margin-top:14px}
.feedback .fb{border:3px solid var(--ink);border-radius:12px;padding:12px;font-size:.9rem;background:var(--grad2)}
.result{ text-align:center;padding:26px 12px}
.result .score{font-size:3.2rem;font-weight:900}

/* ---------- Reading ---------- */
.passage{font-family:var(--jp);font-size:1.12rem;line-height:2.4;background:#fff;border:3px solid var(--ink);
  border-radius:14px;padding:16px;margin-bottom:16px}
.ptitle{font-weight:800;font-size:1rem;margin-bottom:8px}
.hint{font-size:.78rem;color:var(--gray-dk);font-weight:700;margin-bottom:10px}

/* ---------- Home stats ---------- */
.statrow{display:flex;gap:12px;margin-bottom:16px}
.stat{flex:1;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);
  padding:12px 8px;text-align:center}
.stat .n{font-size:1.7rem;font-weight:900;line-height:1.1}
.stat .l{font-size:.68rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#555C66;margin-top:2px}
.duebadge{display:inline-block;background:var(--crimson);color:#fff;border:2.5px solid var(--ink);border-radius:999px;
  padding:2px 10px;font-size:.75rem;font-weight:900;margin-left:8px}

/* ---------- Settings ---------- */
.setrow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px dashed #D8D3C8}
.setrow:last-child{border-bottom:none}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:38px;height:38px;border:3px solid var(--ink);border-radius:10px;background:#fff;font-weight:900;
  font-size:1.1rem;box-shadow:2px 2px 0 var(--ink)}
.stepper span{font-weight:900;min-width:28px;text-align:center}
textarea.io{width:100%;height:110px;border:3px solid var(--ink);border-radius:12px;padding:10px;font-size:.75rem;
  font-family:monospace;background:#fff;margin-top:10px}
.notice{font-size:.78rem;color:#555C66;margin-top:8px;line-height:1.45}

#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;
  border-radius:12px;padding:10px 16px;font-size:.8rem;font-weight:700;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:99;max-width:86%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media (min-width:560px){
  .kgrid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}
  .hero .glyph{font-size:190px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script>
const DATA=[];
function K(k,m,on,kun,rad,comps,etype,ety,mn,voc,sim,sent){
  DATA.push({k,m,on,kun,rad,comps,etype,ety,mn,voc,sim,sent});
}

K("不",["not","un-","non-"],["フ","ブ"],[],"一|one",[["一","one"],["丆","calyx shape"]],
"象形 pictograph",
"Originally a drawing of a flower calyx (or in another account, a bird soaring up and not coming down). The character was borrowed very early purely for its sound to write the negative prefix, and the original meaning was lost.",
"A bird flies up and will <b>not</b> come back down.",
[["不便","ふべん","inconvenient"],["不安","ふあん","uneasy, anxious"],["不足","ふそく","shortage, not enough"]],
[["未","(N3) not yet: an open top with two crossbars"],["下","below: a position marker, one stroke simpler"]],
["この{町|まち}は{駅|えき}から{遠|とお}くて{不便|ふべん}です。","This town is far from the station and inconvenient."]);

K("世",["world","generation","society"],["セ","セイ"],["よ"],"一|one",[["十","ten, three times"]],
"会意 compound ideograph",
"Three 十 (ten) joined together: thirty years, the span of one human generation. From one generation it extended to the succession of generations, and then to the whole world they live in.",
"Three tens chained together: thirty years is one <b>generation</b> in this <b>world</b>.",
[["世界","せかい","the world"],["世話","せわ","care, looking after"],["二世","にせい","second generation"]],
[["土","earth: a simple cross on a base line"],["廿","(rare) twenty: the shape 世 grew from"]],
["{世界|せかい}にはいろいろな{国|くに}があります。","There are all kinds of countries in the world."]);

K("主",["main","master","lord"],["シュ"],["ぬし","おも"],"丶|dot",[["丶","flame"],["王","lamp stand"]],
"象形 pictograph",
"A lamp stand with a flame burning on top. The one who keeps the household flame lit is the master of the house, so the character came to mean master, owner, and main.",
"The dot is the flame; the <b>master</b> of the house keeps it burning.",
[["主人","しゅじん","husband; master"],["主婦","しゅふ","housewife"],["飼い主","かいぬし","pet owner"]],
[["住","add a person: to live somewhere"],["注","add water: to pour"],["王","king, missing the flame on top"]],
["ご{主人|しゅじん}はお{元気|げんき}ですか。","Is your husband doing well?"]);

K("事",["thing","matter","affair"],["ジ"],["こと"],"亅|hook",[["口","record"],["ヨ","hand"]],
"会意 compound ideograph",
"A hand holding up a pole with a flag or written record: performing an official duty. From official business it broadened to affairs and matters in general, the abstract counterpart of 物 (physical things).",
"A hand raising the record of official <b>matters</b>.",
[["仕事","しごと","work, job"],["用事","ようじ","errand, business"],["食事","しょくじ","meal"],["大事","だいじ","important"]],
[["字","character: a child under a roof"],["書","(N5) to write: shares the hand element"]],
["{今日|きょう}は{仕事|しごと}のあとで{用事|ようじ}があります。","Today I have an errand after work."]);

K("京",["capital"],["キョウ","ケイ"],[],"亠|lid",[["亠","roof"],["口","gate"],["小","pillars"]],
"象形 pictograph",
"A tall gate tower built on a hill, the kind that stood at the entrance of a capital city. Tall architecture marked the seat of power, so the drawing itself came to mean capital.",
"A tall tower on stilts guards the <b>capital</b>.",
[["東京","とうきょう","Tokyo"],["京都","きょうと","Kyoto"]],
[["高","(N5) tall: the same tower with an extra box"],["景","(N3) scenery: sun over the capital"]],
["{東京|とうきょう}から{京都|きょうと}まで{新幹線|しんかんせん}で{行|い}きました。","I went from Tokyo to Kyoto by bullet train."]);

K("仕",["serve","do","work"],["シ"],["つか.える"],"亻|person",[["亻","person"],["士","scholar (sound シ)"]],
"形声 phono-semantic",
"A person 亻 plus 士, a scholar official, which also supplies the sound シ. A person in the role of an official serves, and in Japanese the character attached itself to する to write 仕事 and 仕方.",
"A person standing beside an official, ready to <b>serve</b>.",
[["仕事","しごと","work, job"],["仕方","しかた","way of doing"],["仕方がない","しかたがない","it cannot be helped"]],

/* ===== N4 Kanji Mastery, app core ===== */
const SKEY='n4k';
const store={
  mem:null,
  async load(){
    if(typeof window!=='undefined'&&window.storage){
      try{const r=await window.storage.get(SKEY);return r?r.value:null}catch(e){return null}
    }
    try{return localStorage.getItem(SKEY)}catch(e){return this.mem}
  },
  async save(v){
    this.mem=v;
    if(typeof window!=='undefined'&&window.storage){
      try{await window.storage.set(SKEY,v);return}catch(e){}
    }
    try{localStorage.setItem(SKEY,v)}catch(e){}
  }
};

/* ===== SRS ===== */
function ensureCards(k){
  if(!P.cards[k+':m'])P.cards[k+':m']={iv:0,ease:2.5,due:today(),reps:0,lapses:0};
  if(!P.cards[k+':r'])P.cards[k+':r']={iv:0,ease:2.5,due:today(),reps:0,lapses:0};
}
function schedule(c,g){
  if(g===0){c.lapses++;c.ease=Math.max(1.3,c.ease-0.2);c.iv=0;c.due=today();}
  else if(g===1){c.ease=Math.max(1.3,c.ease-0.15);c.iv=c.iv<1?1:Math.max(c.iv+1,Math.round(c.iv*1.2));c.due=today()+c.iv;}
  else if(g===2){c.iv=c.iv<1?1:Math.round(c.iv*c.ease);c.due=today()+c.iv;}
  else{c.ease=Math.min(3,c.ease+0.1);c.iv=c.iv<1?3:Math.round(c.iv*c.ease*1.3);c.due=today()+c.iv;}
  c.reps++;
}
function proj(c,g){const t={iv:c.iv,ease:c.ease,due:c.due,reps:c.reps,lapses:c.lapses};schedule(t,g);return g===0?'again':t.iv+'d'}

/* ===== skills and depth ===== */
const SKILLS=['meaning','reading','vocab','context'];
const SKLBL={meaning:'Meaning',reading:'Reading',vocab:'Vocab',context:'Context'};
function logSkill(k,skill,ok){
  P.skills[k]=P.skills[k]||{};
  const a=P.skills[k][skill]=P.skills[k][skill]||[];
  a.push(ok?1:0);if(a.length>12)a.shift();
  save();
}
function skillAcc(k,skill){const a=(P.skills[k]||{})[skill]||[];if(!a.length)return null;return a.reduce((x,y)=>x+y,0)/a.length}
function skillN(k){const s=P.skills[k]||{};return SKILLS.reduce((n,sk)=>n+((s[sk]||[]).length),0)}
function overallAcc(k){const s=P.skills[k]||{};let c=0,t=0;SKILLS.forEach(sk=>{(s[sk]||[]).forEach(v=>{t++;c+=v})});return t?c/t:0}
function depth(k){
  const m=P.cards[k+':m'],r=P.cards[k+':r'];
  const n=skillN(k);
  if(!m&&!r&&n===0&&!P.seen[k])return 0;
  if(!m||!r)return 1;
  const iv=Math.min(m.iv,r.iv);
  const acc=overallAcc(k);
  const ctx=((P.skills[k]||{}).context||[]).length;
  if(m.reps>=1&&r.reps>=1&&iv>=21&&acc>=0.9&&n>=20)return 5;
  if(iv>=10&&acc>=0.8&&ctx>=2&&n>=12)return 4;
  if(iv>=4&&acc>=0.7&&n>=6)return 3;
  if(m.reps>=1&&r.reps>=1&&iv>=1)return 2;
  return 1;
}

/* ===== utils ===== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function rand(a){return a[Math.floor(Math.random()*a.length)]}
function kunDisp(s){const i=s.indexOf('.');return i<0?esc(s):esc(s.slice(0,i))+'<span class="oku">・'+esc(s.slice(i+1))+'</span>'}
function furiHTML(markup){
  return esc(markup).replace(/\{([^|]+)\|([^}]+)\}/g,(_,a,b)=>'<span class="w" data-say="'+esc(a)+'" onclick="APP.tapWord(this)"><ruby>'+a+'<rt>'+b+'</rt></ruby></span>')
}
function kanaOf(markup){return markup.replace(/\{([^|]+)\|([^}]+)\}/g,'$2')}
function plainSent(markup){return markup.replace(/\{([^|]+)\|([^}]+)\}/g,'$1')}
function sentWords(markup){const out=[];markup.replace(/\{([^|]+)\|([^}]+)\}/g,(_,a,b)=>{out.push([a,b]);return ''});return out}

/* ===== speech (Google Translate TTS, Web Speech fallback) ===== */
let VOJA=null,audioEl=null,sayToken=0,objUrl=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();VOJA=vs.find(v=>/^ja/i.test(v.lang)&&/Kyoko|O-?Ren|Google 日本語|Otoya/i.test(v.name))||vs.find(v=>/^ja/i.test(v.lang))||null}catch(e){}}
if(typeof speechSynthesis!=='undefined'){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
function toast(t){
  let el=document.getElementById('toast');
  if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el)}
  el.textContent=t;el.classList.add('on');
  clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2600);
}
function gTtsUrls(text){
  const q=encodeURIComponent(text);
  const google=[
    'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q='+q,
    'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ja&q='+q
  ];
  if(typeof navigator!=='undefined'&&navigator.serviceWorker&&navigator.serviceWorker.controller)
    return [appBase()+'tts?q='+q,...google];
  return google;
}
function appBase(){
  let p=location.pathname;
  if(p.endsWith('/'))return p;
  if(/\.html$/i.test(p))return p.slice(0,p.lastIndexOf('/')+1);
  return p+'/';
}
function registerSw(){
  if(!('serviceWorker' in navigator))return Promise.resolve();
  return navigator.serviceWorker.register(appBase()+'sw.js',{scope:appBase()}).catch(()=>{});
}
function splitTts(text,max){
  max=max||180;
  if(text.length<=max)return [text];
  const out=[],parts=text.split(/([。、！？\n])/);
  let buf='';
  for(const p of parts){
    if((buf+p).length>max){
      if(buf.trim())out.push(buf.trim());
      buf=p;
    }else buf+=p;
  }
  if(buf.trim())out.push(buf.trim());
  if(out.length)return out;
  const hard=[];
  for(let i=0;i<text.length;i+=max)hard.push(text.slice(i,i+max));
  return hard;
}
function stopSpeech(){
  sayToken++;
  if(audioEl){audioEl.pause();audioEl.onended=null;audioEl.onerror=null;audioEl=null}
  if(objUrl){URL.revokeObjectURL(objUrl);objUrl=null}
  if(typeof speechSynthesis!=='undefined')try{speechSynthesis.cancel()}catch(e){}
}
function sayFallback(t){
  if(typeof speechSynthesis==='undefined'){toast('Audio unavailable. Check your connection.');return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='ja-JP';if(VOJA)u.voice=VOJA;u.rate=0.92;
    speechSynthesis.speak(u);
  }catch(e){toast('Audio is not available here.')}
}
function playAudioEl(a,token){
  return new Promise((resolve,reject)=>{
    if(token!==sayToken)return resolve();
    audioEl=a;
    a.referrerPolicy='no-referrer';
    let settled=false;
    const done=()=>{if(settled)return;settled=true;clearTimeout(timer);if(token===sayToken)resolve()};
    const fail=()=>{if(settled)return;settled=true;clearTimeout(timer);if(token!==sayToken)resolve();else reject(new Error('audio'))};
    const timer=setTimeout(fail,8000);
    a.onended=done;
    a.onerror=fail;
    const start=()=>a.play().catch(fail);
    if(a.readyState>=2)start();
    else{a.oncanplaythrough=()=>{a.oncanplaythrough=null;start()};a.load()}
  });
}
async function playGttsUrl(url,token){
  const a=new Audio();
  a.src=url;
  await playAudioEl(a,token);
  return true;
}
async function playGttsText(text,token){
  const urls=gTtsUrls(text);
  let lastErr=null;
  for(const url of urls){
    if(token!==sayToken)return false;
    try{return await playGttsUrl(url,token)}catch(e){lastErr=e}
  }
  throw lastErr||new Error('tts failed');
}
async function speakGoogle(text,token){
  const chunks=splitTts(text);
  try{
    for(const chunk of chunks){
      if(token!==sayToken)return;
      await playGttsText(chunk,token);
    }
  }catch(e){
    if(token!==sayToken)return;
    toast('Google音声が使えません。広告ブロッカーをオフにしてください。');
    sayFallback(text);
  }
}
function say(t){
  if(!t)return;
  const text=String(t).trim();
  if(!text)return;
  stopSpeech();
  const token=sayToken;
  speakGoogle(text,token);
}

let BQ='',BF=-1;
function bMatch(d){
  if(BF>=0&&depth(d.k)!==BF)return false;
  if(!BQ)return true;
  const q=BQ.toLowerCase();
  if(d.k===BQ||d.k.includes(BQ))return true;
  if(d.m.join(' ').toLowerCase().includes(q))return true;
  if(d.on.join(' ').includes(BQ)||d.kun.join(' ').replace(/\./g,'').includes(BQ))return true;
  if(d.voc.some(v=>v[0].includes(BQ)||v[1].includes(BQ)||v[2].toLowerCase().includes(q)))return true;
  return false;
}

let S=null; // session
function buildSession(){
  const dstr=new Date().toDateString();
  if(P.intro.date!==dstr){P.intro={date:dstr,count:0}}
  const t=today();
  const due=shuffle(Object.keys(P.cards).filter(id=>P.cards[id].due<=t));
  const left=Math.max(0,P.settings.newPerDay-P.intro.count);
  const fresh=ALLK.filter(k=>!P.cards[k+':m']).slice(0,left);
  const newQ=[];
  fresh.forEach(k=>{ensureCards(k);P.intro.count++;newQ.push(k+':m',k+':r')});
  if(fresh.length)save();
  S={q:due.concat(newQ),i:0,flip:false,n:{0:0,1:0,2:0,3:0},newSet:new Set(newQ)};
}

/* ===== QUIZ ENGINE ===== */
let Q=null; // {list,i,score,answered,title,back,retry}
function poolK(needVoc){
  let p=ALLK.filter(k=>depth(k)>=1);
  if(p.length<8)p=ALLK.slice();
  if(needVoc)p=p.filter(k=>MAP[k].voc.length);
  return p;
}
const READPOOL=[];DATA.forEach(d=>d.voc.forEach(v=>READPOOL.push(v[1])));
const WORDPOOL=[];DATA.forEach(d=>d.voc.forEach(v=>WORDPOOL.push(v)));
function readDistract(correct,n){
  const near=READPOOL.filter(x=>x!==correct&&Math.abs(x.length-correct.length)<=1);
  const out=[];const seen=new Set([correct]);
  shuffle(near.length>=n?near:READPOOL.filter(x=>x!==correct)).forEach(x=>{if(out.length<n&&!seen.has(x)){out.push(x);seen.add(x)}});
  return out;
}
function optify(correct,distract,fmt){
  const opts=shuffle([correct].concat(distract));
  return {opts:opts.map(fmt||(x=>x)),a:opts.indexOf(correct)};
}
function qMeaning(k){
  const e=MAP[k];
  const d=shuffle(ALLK.filter(x=>x!==k)).slice(0,3).map(x=>MAP[x].m[0]);
  const o=optify(e.m[0],d);
  return {k,skill:'meaning',html:'<div class="qbig jp">'+e.k+'</div><div class="qsub">この漢字の意味は? What does it mean?</div>',opts:o.opts.map(esc),a:o.a,jp:false,fb:esc(e.k)+' = '+esc(e.m.join(', '))};
}
function qReading(k,v){
  const e=MAP[k];v=v||rand(e.voc);
  const o=optify(v[1],readDistract(v[1],3));
  return {k,skill:'reading',html:'<div class="qword jp">'+esc(v[0])+'</div><div class="qsub">読み方は? How is it read?</div>',opts:o.opts.map(esc),a:o.a,jp:true,fb:esc(v[0])+' = '+esc(v[1])+' &middot; '+esc(v[2])};
}
function qLook(k){
  const e=MAP[k];
  let cands=(e.sim||[]).map(s=>s[0]).filter(inDeck).filter(x=>x!==k);
  const pad=shuffle(ALLK.filter(x=>x!==k&&!cands.includes(x)));
  while(cands.length<3)cands.push(pad.pop());
  cands=cands.slice(0,3);
  const o=optify(k,cands);
  return {k,skill:'meaning',html:'<div class="qtext">「<b>'+esc(e.m[0])+'</b>」の漢字はどれ?<br><span class="qsub">Which kanji means '+esc(e.m[0])+'?</span></div>',opts:o.opts,a:o.a,jp:true,big:true,fb:esc(e.k)+' = '+esc(e.m[0])+'. '+((e.sim&&e.sim[0])?esc(e.sim[0][0])+': '+esc(e.sim[0][1]):'')};
}
function qVocab(k,v){
  const e=MAP[k];v=v||rand(e.voc);
  const d=shuffle(WORDPOOL.filter(w=>w[0]!==v[0])).slice(0,3).map(w=>w[0]);
  const o=optify(v[0],d);
  return {k,skill:'vocab',html:'<div class="qtext">Which word means<br>&ldquo;<b>'+esc(v[2])+'</b>&rdquo;?</div>',opts:o.opts.map(esc),a:o.a,jp:true,fb:esc(v[0])+'（'+esc(v[1])+'）= '+esc(v[2])};
}
function qContext(k){
  const e=MAP[k];
  const ws=sentWords(e.sent[0]);
  const tgt=ws.find(w=>w[0].includes(k))||ws[0];
  const plain=plainSent(e.sent[0]).replace(tgt[0],'<u style="text-decoration-color:var(--crimson);text-decoration-thickness:3px">'+tgt[0]+'</u>');
  const o=optify(tgt[1],readDistract(tgt[1],3));
  return {k,skill:'context',html:'<div class="qsent jp">'+plain+'</div><div class="qsub">下線の言葉の読み方は? Reading of the underlined word?</div>',opts:o.opts.map(esc),a:o.a,jp:true,fb:esc(tgt[0])+' = '+esc(tgt[1])+'<br><span class="small">'+esc(e.sent[1])+'</span>'};
}
const GENS={meaning:qMeaning,reading:qReading,look:qLook,vocab:qVocab,context:qContext};
const EXMETA={meaning:['意味','Meaning quiz','Kanji to meaning'],reading:['読み','Reading quiz','Word to kana'],look:['そっくり','Lookalikes','Pick the right kanji among confusables'],vocab:['語彙','Vocabulary','Meaning to word'],context:['文の中で','In context','Read the word inside a sentence']};
function startQuiz(type){
  const pool=shuffle(poolK(type==='reading'||type==='vocab'));
  const list=pool.slice(0,10).map(k=>GENS[type](k));
  Q={list,i:0,score:0,answered:false,title:EXMETA[type][1],back:'#/ex',retry:()=>startQuiz(type)};
}
function startDrill(k){
  const e=MAP[k];
  let list=[qMeaning(k)];
  e.voc.slice(0,3).forEach(v=>list.push(qReading(k,v)));
  list.push(qLook(k));
  if(e.voc.length)list.push(qVocab(k,e.voc[0]));
  list.push(qContext(k));
  Q={list:shuffle(list).slice(0,8),i:0,score:0,answered:false,title:e.k+' ドリル',back:'#/kanji/'+k,retry:()=>startDrill(k)};
}
function vQuiz(){
  if(!Q)return head('Drills',true)+'<div class="panel">Session expired.</div>';
  if(Q.i>=Q.list.length){
    const sc=Q.score,tot=Q.list.length;
    return head(Q.title,true)+'<div class="panel result"><div class="eyebrow">Result</div><div class="score" style="color:'+(sc/tot>=0.8?'var(--teal-deep)':sc/tot>=0.5?'var(--orange)':'var(--crimson)')+'">'+sc+'<span style="font-size:1.4rem;color:#8B929B">/'+tot+'</span></div></div>'+
    '<div class="btnrow"><button class="bigbtn ghost" onclick="APP.retry()">もう一度 Again</button><button class="bigbtn" onclick="APP.go(\''+Q.back+'\')">OK</button></div>';
  }
  const q=Q.list[Q.i];
  const opts=q.opts.map((o,i)=>{
    let cls='opt'+(q.jp?' jpop':'');
    let sty=q.big?' style="font-family:var(--glyphfont);font-size:2.3rem"':'';
    if(Q.answered){
      if(i===q.a)cls+=' right';
      else if(i===Q.pick)cls+=' wrong';
      else cls+=' dim';
    }
    return '<button class="'+cls+'"'+sty+' onclick="APP.pick('+i+')">'+o+'</button>';
  }).join('');
  const fb=Q.answered?'<div class="feedback"><div class="fb">'+(Q.pick===q.a?'<b style="color:var(--teal-deep)">正解!</b> ':'<b style="color:var(--crimson)">おしい!</b> ')+q.fb+' <a style="font-weight:800;color:var(--teal-deep)" href="#/kanji/'+q.k+'">詳しく見る &rarr;</a></div><button class="bigbtn" style="margin-top:12px" onclick="APP.next()">'+(Q.i+1>=Q.list.length?'結果 Result':'次へ Next')+'</button></div>':'';
  return head(Q.title,true)+
  '<div class="sessionbar"><span>'+(Q.i+1)+' / '+Q.list.length+'</span><div class="progress"><div style="width:'+(100*Q.i/Q.list.length)+'%"></div></div><span>'+Q.score+'点</span></div>'+
  '<div class="qprompt">'+q.html+'</div>'+
  '<div class="opts'+(q.big?' two':'')+'">'+opts+'</div>'+fb;
}
APP.pick=function(i){
  if(!Q||Q.answered)return;
  const q=Q.list[Q.i];
  Q.answered=true;Q.pick=i;
  const ok=i===q.a;
  if(ok)Q.score++;
  logSkill(q.k,q.skill,ok);
  render();
};
APP.next=function(){Q.i++;Q.answered=false;Q.pick=-1;render()};
APP.retry=function(){if(Q&&Q.retry){Q.retry();render()}};
APP.startEx=function(t){startQuiz(t);go('#/ex/run')};

function vExHub(){
  const tiles=Object.keys(EXMETA).map((t,i)=>
    '<button class="tile'+(i%2?' crim':'')+'" onclick="APP.startEx(\''+t+'\')"><h3>'+EXMETA[t][0]+' '+EXMETA[t][1]+'</h3><div class="sub">'+EXMETA[t][2]+'</div></button>').join('');
  return head()+'<div class="muted small" style="margin-bottom:12px">10 questions, drawn from kanji you have started. Results feed each kanji\'s depth.</div>'+tiles;
}

/* ===== READING ===== */
let R=null;
function vRead(){
  const rows=PASSAGES.map((p,i)=>{
    const sc=P.readScores[i];
    return '<button class="tile'+(i%2?' crim':'')+'" onclick="APP.go(\'#/read/'+i+'\')"><h3 class="jp">'+esc(p.t)+(sc?'<span class="duebadge" style="background:var(--teal-deep)">'+sc.s+'/'+sc.t+'</span>':'')+'</h3><div class="sub">'+esc(p.en)+' &middot; '+esc(p.lv)+'</div></button>';
  }).join('');
  return head()+'<div class="muted small" style="margin-bottom:12px">Short passages within N4 and N5. Tap any word for its reading, then answer the questions.</div>'+rows;
}
function vPassage(i){
  const p=PASSAGES[i];
  if(!p)return head('読',true)+'<div class="panel">Not found.</div>';
  if(!R||R.pi!==i){R={pi:i,qi:0,score:0,answered:false,pick:-1}}
  let quiz='';
  if(R.qi>=p.qs.length){
    if(!R.saved){P.readScores[i]={s:R.score,t:p.qs.length};R.saved=true;save()}
    quiz='<div class="panel result"><div class="eyebrow">Result</div><div class="score" style="color:'+(R.score===p.qs.length?'var(--teal-deep)':'var(--orange)')+'">'+R.score+'<span style="font-size:1.4rem;color:#8B929B">/'+p.qs.length+'</span></div></div>'+
    '<div class="btnrow"><button class="bigbtn ghost" onclick="APP.rretry()">もう一度 Again</button><button class="bigbtn" onclick="APP.go(\'#/read\')">読み物一覧 All passages</button></div>';
  }else{
    const q=p.qs[R.qi];
    const opts=q.o.map((o,j)=>{
      let cls='opt jpop';
      if(R.answered){if(j===q.a)cls+=' right';else if(j===R.pick)cls+=' wrong';else cls+=' dim'}
      return '<button class="'+cls+'" style="font-size:1rem" onclick="APP.rpick('+j+')">'+esc(o)+'</button>';
    }).join('');
    const fb=R.answered?'<div class="feedback"><button class="bigbtn" style="margin-top:4px" onclick="APP.rnext()">'+(R.qi+1>=p.qs.length?'結果 Result':'次へ Next')+'</button></div>':'';
    quiz='<div class="sessionbar"><span>問 '+(R.qi+1)+' / '+p.qs.length+'</span><div class="progress"><div style="width:'+(100*R.qi/p.qs.length)+'%"></div></div><span>'+R.score+'点</span></div>'+
    '<div class="qprompt" style="text-align:left"><div class="qtext jp">'+esc(q.q)+'</div></div>'+
    '<div class="opts">'+opts+'</div>'+fb;
  }
  return head(esc(p.t),true)+
  '<div class="hint">Tap a word for its reading and audio</div>'+
  '<div class="passage" id="pbody"><div class="ptitle">'+esc(p.t)+' <span class="muted small">'+esc(p.en)+'</span></div>'+furiHTML(p.body)+'</div>'+
  '<div style="display:flex;gap:8px;margin-bottom:16px"><button class="chip" data-say="'+esc(plainSent(p.body))+'" onclick="APP.sayEl(this)">&#9654; 音声 Speak</button><button class="chip" data-on="0" onclick="APP.toggleAll(this,\'pbody\')">すべて表示 Show all</button></div>'+
  quiz;
}
APP.rpick=function(j){
  if(!R||R.answered)return;
  const p=PASSAGES[R.pi],q=p.qs[R.qi];
  R.answered=true;R.pick=j;
  if(j===q.a)R.score++;
  render();
};
APP.rnext=function(){R.qi++;R.answered=false;R.pick=-1;render()};
APP.rretry=function(){R={pi:R.pi,qi:0,score:0,answered:false,pick:-1};render()};

/* ===== SETTINGS ===== */
let armReset=false;
function vSettings(){
  return head('Settings',true)+
  '<div class="panel"><h2>学習 Study</h2><div class="setrow"><span style="font-weight:700">New kanji per day</span><div class="stepper"><button onclick="APP.step(-1)">&minus;</button><span>'+P.settings.newPerDay+'</span><button onclick="APP.step(1)">+</button></div></div></div>'+
  '<div class="panel"><h2>データ Data</h2>'+
  '<div class="btnrow"><button class="bigbtn ghost" onclick="APP.doExport()">Export progress</button><button class="bigbtn ghost" onclick="APP.doImport()">Import</button></div>'+
  '<textarea class="io" id="io" placeholder="Export fills this box. To import, paste a backup here and press Import."></textarea>'+
  '<div class="notice" id="ionote">Progress saves automatically in this browser. Export gives you a text backup you can paste back in anywhere.</div>'+
  '<div style="height:10px"></div><button class="bigbtn" style="background:var(--crimson);box-shadow:5px 5px 0 var(--ink)" id="resetbtn" onclick="APP.doReset()">Reset all progress</button></div>'+
  '<div class="panel"><h2>この アプリ About</h2><div class="notice">188 kanji following the widely used community N4 list. The JLPT has not published official kanji lists since 2010, so every N4 list is an approximation.<br><br>Reading first: this app covers recognition, readings, meaning, and context only. There is no stroke order and no writing practice anywhere, by design.<br><br>The style toggle on each kanji page switches every large glyph between Gothic, Mincho, and Textbook style. Textbook style is the closest to handwritten forms, so it is worth reading all three.<br><br>Audio uses Google Translate text-to-speech through a same-origin proxy for natural Japanese pronunciation when you tap words, readings, or the Speak button. An internet connection is required. If Google audio is blocked, the app falls back to your device voice.<br><br>Depth 0 to 5 per kanji combines flashcard spacing with drill accuracy across meaning, reading, vocabulary, and context. Mastered means long intervals and 90 percent accuracy over many attempts.</div></div>';
}
APP.step=function(d){P.settings.newPerDay=Math.min(20,Math.max(2,P.settings.newPerDay+d));save();render()};
APP.doExport=function(){document.getElementById('io').value=JSON.stringify(P);document.getElementById('ionote').textContent='Copied into the box. Select all and copy it somewhere safe.'};
APP.doImport=function(){
  const t=document.getElementById('io').value.trim();
  if(!t){document.getElementById('ionote').textContent='Paste a backup into the box first.';return}
  try{const o=JSON.parse(t);if(!o.cards)throw 0;P=Object.assign({cards:{},skills:{},seen:{},intro:{date:'',count:0},settings:{newPerDay:8},readScores:{},v:1},o);save();document.getElementById('ionote').textContent='Imported. Your progress is restored.';}
  catch(e){document.getElementById('ionote').textContent='That did not look like a valid backup.'}
  applyFont();
};
APP.doReset=function(){
  const b=document.getElementById('resetbtn');
  if(!armReset){armReset=true;b.textContent='Tap again to confirm reset';return}
  P={cards:{},skills:{},seen:{},intro:{date:'',count:0},settings:{newPerDay:P.settings.newPerDay,glyphFont:P.settings.glyphFont},readScores:{},v:1};
  armReset=false;S=null;Q=null;R=null;save();render();
};

/* ===== RENDER ===== */
function render(){
  const p=route();
  const app=document.getElementById('app');
  let html='';
  switch(p[0]||'home'){
    case 'home':html=vHome();break;
    case 'browse':html=vBrowse();break;
    case 'kanji':html=vKanji(decodeURIComponent(p[1]||''));break;
    case 'cards':html=vCards();break;
    case 'ex':html=(p[1]==='run')?vQuiz():vExHub();break;
    case 'drill':{const k=decodeURIComponent(p[1]||'');if(!Q||Q.back!=='#/kanji/'+k||Q.i>=Q.list.length)startDrill(k);html=vQuiz();break}
    case 'read':html=(p[1]!==undefined&&p[1]!=='')?vPassage(parseInt(p[1],10)):vRead();break;
    case 'settings':armReset=false;html=vSettings();break;
    default:html=vHome();
  }
  app.innerHTML=html;
  renderNav();
  if((p[0]||'home')==='browse')bindBrowse();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',render);

(async function init(){
  try{
    const v=await store.load();
    if(v){const o=JSON.parse(v);P=Object.assign({cards:{},skills:{},seen:{},intro:{date:'',count:0},settings:{newPerDay:8},readScores:{},v:1},o);
      P.settings=Object.assign({newPerDay:8,glyphFont:'gothic'},P.settings)}
  }catch(e){}
  if(!P.settings.glyphFont)P.settings.glyphFont='gothic';
  applyFont();
  registerSw();
  if(!location.hash)location.hash='#/home';
  render();
})();
</script>
</body></html>

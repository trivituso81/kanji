<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>聞 · Kanji lesson</title>
<style>
:root{
  --paper:#f6f1e7;
  --ink:#1b1a17;
  --muted:#8a8478;
  --line:#d9cfbc;
  --accent:#c8412b;
  --cool:#2f6f8f;
  --skin:#f2c9a8;
  --ok:#2f8f5b;
  --kanji-font:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif CJK JP","Noto Serif JP","MS Mincho",serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overflow:hidden}
.kanji{font-family:var(--kanji-font);font-weight:500}

#app{height:100dvh;max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 0 env(safe-area-inset-bottom);user-select:none;-webkit-user-select:none}

header{display:flex;align-items:center;justify-content:space-between;padding:0 20px;min-height:32px}
.dots{display:flex;gap:6px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.on{background:var(--ink);transform:scale(1.25)}
.dots i.past{background:var(--muted)}
.tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;opacity:0;transition:opacity .4s}
.tag.show{opacity:1}
.tag.origin{background:var(--ink);color:var(--paper)}
.tag.aid{border:1.5px dashed var(--muted);color:var(--muted)}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 20px;position:relative;min-height:0}
.step{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  animation:fadein .45s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.art{width:100%;max-width:360px;height:auto;display:block;overflow:visible}

.sentence{min-height:4.2em;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:0 28px;font-size:1.3rem;line-height:1.45;opacity:0;transform:translateY(6px);transition:opacity .5s,transform .5s}
.sentence.show{opacity:1;transform:none}
.sentence .kanji{font-size:1.15em}

footer{height:72px;display:flex;align-items:center;justify-content:center}
.next{width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);display:flex;
  align-items:center;justify-content:center;opacity:0;transform:scale(.8);pointer-events:none;transition:opacity .4s,transform .4s;
  animation:none}
.next.show{opacity:1;transform:none;pointer-events:auto;animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.next svg{width:26px;height:26px}
.restart{background:transparent;color:var(--ink);border:2px solid var(--ink)}

/* hotspot / hint pulse */
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.9;transform:scale(.6)}100%{opacity:0;transform:scale(1.35)}}
.hit{cursor:pointer}

/* morph slider */
.morph{width:100%;max-width:300px}
.frames{position:relative;width:100%;aspect-ratio:1}
.frames .frame{position:absolute;inset:0;width:100%;height:100%;transition:none}
.slider{width:100%;display:flex;flex-direction:column;gap:6px}
input[type=range]{width:100%;height:44px;margin:0;-webkit-appearance:none;appearance:none;background:transparent;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--accent);
  border:3px solid var(--paper);box-shadow:0 2px 6px rgba(0,0,0,.25);margin-top:-14px}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--accent);border:3px solid var(--paper)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.04em;padding:0 4px}

/* tiles & options */
.tiles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;width:100%}
.tile{min-width:84px;height:84px;padding:0 14px;border-radius:18px;background:#fff;border:2.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:2.4rem;cursor:pointer;
  transition:transform .15s,background .25s,border-color .25s,color .25s,opacity .4s;touch-action:manipulation}
.tile:active{transform:scale(.95)}
.tile.word{font-size:1.15rem;height:64px;padding:0 20px;min-width:0}
.tile.kana{font-size:1.7rem;height:72px;padding:0 16px;min-width:0}
.tile.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tile.ok2{background:var(--cool);border-color:var(--cool);color:#fff}
.tile.dim{opacity:.35;pointer-events:none}
.tile.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.tiles.hidden,.hidden{opacity:0;pointer-events:none;transform:translateY(10px)}
.reveal{transition:opacity .5s,transform .5s}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:300px}
.grid2 .tile{width:100%;min-width:0}

/* compose (drag) */
.compose{position:relative;width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:8px}
.compose .base{width:260px;height:260px}
.compose .glyph{transition:opacity .6s}
.compose .drop{transition:opacity .4s,stroke .3s}
.compose .drop.hot{stroke:var(--accent);stroke-width:5}
.drag{position:absolute;left:50%;bottom:0;width:84px;height:84px;margin-left:-42px;border-radius:18px;background:#fff;
  border:2.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:2.6rem;cursor:grab;
  touch-action:none;will-change:transform;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.drag.lift{cursor:grabbing;box-shadow:0 12px 24px rgba(0,0,0,.2);z-index:3}
.drag.back{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.drag.merge{transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .4s .35s;opacity:0}
.compose-wrap{position:relative;width:100%;height:380px;display:flex;justify-content:center;align-items:flex-start}

/* sound step */
.sound{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.pair{display:flex;align-items:center;gap:18px}
.big{font-size:4.6rem;line-height:1;cursor:pointer}
.reading{font-size:1.4rem;color:var(--muted);min-height:1.5em;transition:color .3s}
.reading.ok{color:var(--ink)}
.arrow{width:28px;height:28px;color:var(--muted)}
.qmark{font-size:1.4rem;color:var(--muted)}

/* usage */
.usage{display:flex;gap:10px;width:100%;justify-content:center;align-items:flex-start}
.usage .item{flex:1;max-width:190px;cursor:pointer}
.usage svg{width:100%;height:auto;overflow:visible}
.bounce{animation:bounce .5s}
@keyframes bounce{0%,100%{transform:none}30%{transform:translateY(-10px) scale(1.04)}}
.fold{transform-box:view-box;transform-origin:120px 130px;transform:scaleY(0);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.open .fold{transform:scaleY(1)}
.speaker{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--ink);background:#fff;display:flex;align-items:center;
  justify-content:center;cursor:pointer}
.speaker svg{width:30px;height:30px}
.speaker.playing{background:var(--ink);color:#fff}

/* completion */
.done-glyph{font-size:7rem;line-height:1;animation:pop .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.readings{display:flex;gap:16px;color:var(--muted);font-size:1.1rem}

@media (max-height:640px){
  .compose .base{width:210px;height:210px}
  .compose-wrap{height:320px}
  .tile{height:72px;font-size:2rem}
  .sentence{font-size:1.15rem;min-height:3.4em}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="dots" id="dots"></div>
    <span class="tag" id="tag"></span>
  </header>
  <main id="stage"></main>
  <div class="sentence" id="sentence"></div>
  <footer>
    <button class="next" id="next" aria-label="Continue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </footer>
</div>

<script>
/* =====================================================================
   CONFIG
   ===================================================================== */
const CONFIG = {
  // Google Cloud Text-to-Speech API key.
  // REMINDER: restrict this key by HTTP referrer in the Google Cloud console
  // (APIs & Services → Credentials → your key → Application restrictions → Websites),
  // and limit it to the Cloud Text-to-Speech API. Anything in this file is public.
  GOOGLE_TTS_API_KEY: 'YOUR_KEY_HERE',
  TTS_VOICE: { languageCode: 'ja-JP', name: 'ja-JP-Neural2-B' },
  TTS_RATE: 0.9,
  // With the placeholder key, speak() falls back to the browser's speechSynthesis
  // so the prototype is still testable. Set a real key to hear the Google voice.
};

/* =====================================================================
   DATA SLICE — just 聞. Shaped like a kanji.json entry so a later
   lesson can be driven from the full dataset instead.
   ===================================================================== */
const KANJI_DATA = {
  '聞': {
    kanji: '聞', level: 'N5',
    meanings: ['hear', 'ask', 'listen'],
    on: ['ブン', 'モン'], kun: ['き.く', 'き.こえる'],
    radical: { c: '耳', meaning: 'ear' },
    components: [
      { c: '門', meaning: 'gate', reading: 'モン', role: 'phonetic' },
      { c: '耳', meaning: 'ear',  reading: 'ジ',   role: 'semantic' },
    ],
    words: [
      { w: '聞く',   kana: 'きく',     en: 'to hear / to ask' },
      { w: '新聞',   kana: 'しんぶん', en: 'newspaper' },
      { w: '聞こえる', kana: 'きこえる', en: 'to be audible' },
    ],
    // Documented etymology (Shuowen: 從耳門聲 — ear for meaning, 門 for sound).
    // The oldest oracle-bone forms show a figure with a hand raised to a large ear;
    // the 門 component is the phonetic that appears by seal script.
    etymology: { type: 'phono-semantic', semantic: '耳', phonetic: '門' },
  },
};

/* =====================================================================
   ART — inline SVG builders. Lesson data refers to these by name.
   Keep them simple and bold.
   ===================================================================== */
const INK = 'var(--ink)', RED = 'var(--accent)', BLUE = 'var(--cool)', SKIN = 'var(--skin)';
const stroke = `fill="none" stroke="${INK}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"`;
const glyph = (ch, size = 150) =>
  `<text class="kanji" x="100" y="104" font-size="${size}" text-anchor="middle" dominant-baseline="central" fill="${INK}">${ch}</text>`;

const ART = {
  // Step 1: courtyard wall, double-door gate, a person with an ear to the door.
  gateScene: () => `
  <svg class="art" viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
    <rect x="0" y="270" width="360" height="50" fill="var(--line)"/>
    <rect x="0" y="130" width="360" height="140" fill="#e9e0cf" stroke="${INK}" stroke-width="4"/>
    <rect x="-6" y="112" width="372" height="22" rx="3" fill="${INK}"/>
    <rect x="106" y="90" width="148" height="28" rx="4" fill="${INK}"/>
    <rect x="118" y="116" width="14" height="154" fill="${INK}"/>
    <rect x="228" y="116" width="14" height="154" fill="${INK}"/>
    <rect x="132" y="124" width="47" height="146" fill="${RED}" stroke="${INK}" stroke-width="4"/>
    <rect x="181" y="124" width="47" height="146" fill="${RED}" stroke="${INK}" stroke-width="4"/>
    <circle cx="168" cy="200" r="5" fill="${INK}"/><circle cx="192" cy="200" r="5" fill="${INK}"/>
    <g class="waves" opacity="0" fill="none" stroke="var(--paper)" stroke-width="4" stroke-linecap="round">
      <path d="M148 170 q-8 11 0 22"/><path d="M158 162 q-14 19 0 38"/><path d="M168 154 q-20 27 0 54"/>
    </g>
    <g id="person">
      <rect x="92" y="200" width="36" height="74" rx="11" fill="${BLUE}" stroke="${INK}" stroke-width="4"/>
      <path d="M124 214 q14 -4 12 -30" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
      <circle cx="114" cy="180" r="18" fill="${SKIN}" stroke="${INK}" stroke-width="4"/>
      <path d="M98 172 q10 -18 30 -10" fill="none" stroke="${INK}" stroke-width="5" stroke-linecap="round"/>
      <circle cx="108" cy="180" r="2.5" fill="${INK}"/>
      <ellipse id="ear" cx="129" cy="181" rx="5.5" ry="8" fill="${SKIN}" stroke="${INK}" stroke-width="3"/>
      <circle class="pulse" cx="129" cy="181" r="26" fill="none" stroke="${RED}" stroke-width="3"/>
      <circle class="hit" data-hotspot cx="129" cy="181" r="34" fill="transparent"/>
    </g>
  </svg>`,

  // Step 2: gate → old form → 門
  gateFrames: () => [
    `<svg class="frame" viewBox="0 0 200 200">
      <rect x="26" y="32" width="148" height="18" rx="3" fill="${INK}"/>
      <rect x="30" y="48" width="12" height="124" fill="${INK}"/><rect x="158" y="48" width="12" height="124" fill="${INK}"/>
      <rect x="46" y="54" width="50" height="118" fill="${RED}" stroke="${INK}" stroke-width="4"/>
      <rect x="104" y="54" width="50" height="118" fill="${RED}" stroke="${INK}" stroke-width="4"/>
      <circle cx="86" cy="120" r="4" fill="${INK}"/><circle cx="114" cy="120" r="4" fill="${INK}"/>
    </svg>`,
    `<svg class="frame" viewBox="0 0 200 200">
      <path d="M46 164 V56 C46 44 56 40 66 40 H84 C92 40 96 46 96 54 V98 H48" ${stroke}/>
      <path d="M48 76 H94" ${stroke}/>
      <path d="M154 164 V56 C154 44 144 40 134 40 H116 C108 40 104 46 104 54 V98 H152" ${stroke}/>
      <path d="M152 76 H106" ${stroke}/>
    </svg>`,
    `<svg class="frame" viewBox="0 0 200 200">${glyph('門')}</svg>`,
  ],

  // Step 3: ear → old form → 耳
  earFrames: () => [
    `<svg class="frame" viewBox="0 0 200 200">
      <path d="M96 34 C132 20 158 54 152 92 C147 126 128 146 118 164 C110 180 86 180 80 160 C76 148 84 138 96 134 C88 118 84 100 88 82 C90 66 92 50 96 34 Z"
        fill="${SKIN}" stroke="${INK}" stroke-width="6" stroke-linejoin="round"/>
      <path d="M108 60 C128 56 140 78 134 100 C130 114 120 122 110 118" fill="none" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>
    </svg>`,
    `<svg class="frame" viewBox="0 0 200 200">
      <path d="M64 50 C72 28 130 24 142 54 C152 76 148 112 138 140 C132 156 120 166 106 160" ${stroke}/>
      <path d="M66 50 C60 90 62 132 66 174" ${stroke}/>
      <path d="M68 88 C90 80 118 80 138 90" ${stroke}/><path d="M68 120 C90 112 116 112 136 122" ${stroke}/>
    </svg>`,
    `<svg class="frame" viewBox="0 0 200 200">${glyph('耳')}</svg>`,
  ],

  // Step 4: 門 with a drop zone inside, and the 聞 result hidden behind it.
  gateDrop: () => `
  <svg class="base" viewBox="0 0 200 200">
    <g class="glyph" data-base>${glyph('門')}</g>
    <g class="glyph" data-result opacity="0">${glyph('聞')}</g>
    <rect class="drop" data-drop x="64" y="92" width="64" height="68" rx="10" fill="none" stroke="${RED}" stroke-width="3.5" stroke-dasharray="7 7"/>
  </svg>`,

  // Step 6: speech bubble and folded newspaper.
  bubble: (word) => `
  <svg viewBox="0 0 240 240">
    <path d="M52 50 H188 Q216 50 216 78 V142 Q216 170 188 170 H96 L60 204 L72 170 H52 Q24 170 24 142 V78 Q24 50 52 50 Z"
      fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"/>
    <text class="kanji" x="120" y="112" font-size="60" text-anchor="middle" dominant-baseline="central" fill="${INK}">${word}</text>
  </svg>`,
  newspaper: (word) => `
  <svg viewBox="0 0 240 240">
    <g class="fold">
      <rect x="24" y="130" width="192" height="88" fill="#fff" stroke="${INK}" stroke-width="5"/>
      <rect x="40" y="146" width="60" height="56" fill="var(--line)"/>
      <g fill="${INK}"><rect x="112" y="146" width="88" height="6"/><rect x="112" y="160" width="88" height="6"/>
        <rect x="112" y="174" width="88" height="6"/><rect x="112" y="188" width="60" height="6"/></g>
    </g>
    <rect x="24" y="42" width="192" height="88" fill="#fff" stroke="${INK}" stroke-width="5"/>
    <text class="kanji" x="76" y="86" font-size="40" text-anchor="middle" dominant-baseline="central" fill="${INK}">${word}</text>
    <g fill="${INK}"><rect x="128" y="60" width="72" height="6"/><rect x="128" y="74" width="72" height="6"/>
      <rect x="128" y="88" width="72" height="6"/><rect x="128" y="102" width="48" height="6"/></g>
    <line x1="24" y1="130" x2="216" y2="130" stroke="${INK}" stroke-width="5"/>
  </svg>`,

  speaker: () => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 10v4h3l4 4V6L7 10H4z" fill="currentColor"/><path d="M15 9a4 4 0 0 1 0 6"/><path d="M17.5 6.5a8 8 0 0 1 0 11"/></svg>`,
};

/* =====================================================================
   LESSON — one array of steps. A second lesson is a new array.
   q: which question the step answers — WHY_SHAPE | WHY_SOUND | WHY_MEANING | USAGE | CHECK
   label: 'origin' for documented etymology, 'memory aid' for invented content (shown on screen).
   Rule: at most one sentence of text per step; exactly one interaction.
   ===================================================================== */
const LESSON = {
  kanji: '聞',
  steps: [
    { q: 'WHY_SHAPE', type: 'scene', label: 'memory aid',
      art: 'gateScene', hotspot: '[data-hotspot]', sfx: 'murmur',
      text: 'Someone is listening at the gate.' },

    { q: 'WHY_SHAPE', type: 'morph', label: 'origin',
      frames: 'gateFrames', ticks: ['drawing', 'old form', 'modern'],
      text: '門, gate. Reads モン.', speak: 'モン' },

    { q: 'WHY_SHAPE', type: 'morph', label: 'origin',
      frames: 'earFrames', ticks: ['drawing', 'old form', 'modern'],
      quiz: { text: 'Which is the ear?', options: ['耳', '目', '口'], answer: '耳' } },

    { q: 'WHY_MEANING', type: 'compose', label: 'memory aid',
      art: 'gateDrop', part: '耳',
      text: 'An ear at the gate: to hear.' },

    { q: 'WHY_SOUND', type: 'sound', label: 'origin',
      text: 'The gate lends its sound.',
      lender: { kanji: '門', reading: 'モン' }, target: '聞',
      options: ['モン', 'ブン', 'セイ'], correct: ['モン', 'ブン'] },

    { q: 'USAGE', type: 'usage', label: 'origin',
      items: [
        { art: 'bubble',    word: '聞く', kana: 'きく' },
        { art: 'newspaper', word: '新聞', kana: 'しんぶん', unfold: true, text: 'new + hear = news' },
      ] },

    { q: 'CHECK', type: 'check',
      tasks: [
        { kind: 'pick',   text: 'Which one means to hear?', options: ['聞', '間', '開', '問'], answer: '聞' },
        { kind: 'pick',   text: 'What does 聞 mean?', options: ['to hear', 'to open', 'to ask'], answer: 'to hear', word: true },
        { kind: 'listen', text: 'Which word did you hear?', kana: 'しんぶん', options: ['新聞', '質問', '時間'], answer: '新聞' },
      ],
      complete: { kanji: '聞', readings: ['きく', 'ブン', 'モン'], text: 'Lesson complete.' } },
  ],
};

/* =====================================================================
   AUDIO — every spoken sound goes through speak(kana).
   ===================================================================== */
const player = new Audio();
let audioCtx = null, unlocked = false;
const SILENT_WAV = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=';

// iOS only lets media start inside a user gesture; prime the shared player once.
function unlockAudio() {
  if (unlocked) return;
  unlocked = true;
  try { player.src = SILENT_WAV; player.play().catch(() => {}); } catch (_) {}
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (_) {}
}
document.addEventListener('pointerdown', unlockAudio, { capture: true });

const ttsCache = new Map();
async function speak(kana) {
  if (!kana) return;
  if (!CONFIG.GOOGLE_TTS_API_KEY || CONFIG.GOOGLE_TTS_API_KEY === 'YOUR_KEY_HERE') return speakFallback(kana);
  try {
    let url = ttsCache.get(kana);
    if (!url) {
      const res = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key=' + encodeURIComponent(CONFIG.GOOGLE_TTS_API_KEY), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          input: { text: kana },
          voice: CONFIG.TTS_VOICE,
          audioConfig: { audioEncoding: 'MP3', speakingRate: CONFIG.TTS_RATE },
        }),
      });
      if (!res.ok) throw new Error('TTS HTTP ' + res.status);
      const data = await res.json();
      url = 'data:audio/mp3;base64,' + data.audioContent;
      ttsCache.set(kana, url);
    }
    await new Promise((resolve, reject) => {
      player.onended = resolve; player.onerror = () => reject(new Error('playback failed'));
      player.src = url; player.play().catch(reject);
    });
  } catch (err) {
    console.warn('Google TTS failed, using browser voice:', err);
    await speakFallback(kana);
  }
}
function speakFallback(kana) {
  return new Promise(resolve => {
    if (!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(kana);
    u.lang = 'ja-JP'; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith('ja'));
    if (v) u.voice = v;
    u.onend = u.onerror = () => resolve();
    speechSynthesis.speak(u);
    setTimeout(resolve, 4000); // safety: some browsers never fire onend
  });
}

// Non-speech effects (synthesised, no assets). 'murmur' = muffled voices behind a door.
function sfx(name) {
  return new Promise(resolve => {
    try {
      const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      audioCtx = ctx;
      if (name === 'murmur') {
        const dur = 1.1, n = Math.floor(ctx.sampleRate * dur);
        const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        const src = ctx.createBufferSource(); src.buffer = buf;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 1.2;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 220; bp.Q.value = 0.7;
        const gain = ctx.createGain();
        const t = ctx.currentTime;
        gain.gain.setValueAtTime(0, t);
        // syllable-like amplitude bumps
        [0.05, 0.22, 0.38, 0.6, 0.78, 0.95].forEach((s, i) => {
          gain.gain.linearRampToValueAtTime(0.9 - i * 0.08, t + s);
          gain.gain.linearRampToValueAtTime(0.15, t + s + 0.09);
        });
        gain.gain.linearRampToValueAtTime(0, t + dur);
        src.connect(lp); lp.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
        src.start(t); src.stop(t + dur);
        src.onended = resolve;
        setTimeout(resolve, dur * 1000 + 100);
      } else resolve();
    } catch (e) { resolve(); }
  });
}

/* =====================================================================
   ENGINE
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const wait = ms => new Promise(r => setTimeout(r, ms));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const stage = $('#stage'), sentenceEl = $('#sentence'), nextBtn = $('#next'), tagEl = $('#tag'), dotsEl = $('#dots');
let index = 0, stepDone = false;

const ui = {
  say(text) {
    sentenceEl.classList.remove('show');
    if (!text) { sentenceEl.innerHTML = ''; return; }
    setTimeout(() => {
      sentenceEl.innerHTML = text.replace(/[\u3040-\u30ff\u4e00-\u9fff]+/g, m => `<span class="kanji">${m}</span>`);
      sentenceEl.classList.add('show');
    }, 120);
  },
  done() {
    if (stepDone) return;
    stepDone = true;
    if (index < LESSON.steps.length - 1) nextBtn.classList.add('show');
  },
  showTag() { tagEl.classList.add('show'); },
};

function render(i) {
  index = i; stepDone = false;
  const step = LESSON.steps[i];
  stage.innerHTML = ''; ui.say('');
  nextBtn.classList.remove('show');
  nextBtn.classList.remove('restart');
  nextBtn.onclick = () => { if (stepDone) render(index + 1); };
  tagEl.className = 'tag' + (step.label ? (step.label === 'origin' ? ' origin' : ' aid') : '');
  tagEl.textContent = step.label || '';
  if (step.label) requestAnimationFrame(ui.showTag);
  dotsEl.innerHTML = LESSON.steps.map((_, k) => `<i class="${k === i ? 'on' : k < i ? 'past' : ''}"></i>`).join('');
  const root = el('div', 'step'); root.dataset.q = step.q; root.dataset.type = step.type;
  stage.appendChild(root);
  RENDERERS[step.type](step, root);
}

// Tap anywhere non-interactive to advance once the step is complete.
stage.addEventListener('click', e => {
  if (!stepDone || index >= LESSON.steps.length - 1) return;
  if (e.target.closest('.interactive')) return;
  render(index + 1);
});
sentenceEl.addEventListener('click', () => { if (stepDone && index < LESSON.steps.length - 1) render(index + 1); });

/* ---- generic option tiles: returns a promise resolving when the answer is picked ---- */
function tiles(options, answer, { word = false, kana = false, grid = false, onWrong, onRight } = {}) {
  const wrap = el('div', (grid ? 'grid2' : 'tiles') + ' interactive');
  const correct = Array.isArray(answer) ? answer : [answer];
  const p = new Promise(resolve => {
    options.forEach(opt => {
      const t = el('button', 'tile ' + (word ? 'word' : kana ? 'kana kanji' : 'kanji'), opt);
      t.onclick = () => {
        if (wrap.dataset.locked) return;
        if (correct.includes(opt)) {
          wrap.dataset.locked = '1';
          t.classList.add('ok');
          wrap.querySelectorAll('.tile').forEach(o => { if (o !== t && !correct.includes(o.textContent)) o.classList.add('dim'); });
          onRight && onRight(t, opt);
          resolve(opt);
        } else {
          t.classList.remove('shake'); void t.offsetWidth; t.classList.add('shake');
          onWrong && onWrong(t, opt);
        }
      };
      wrap.appendChild(t);
    });
  });
  return { wrap, promise: p };
}

/* ---- morph slider shared by steps 2 and 3 ---- */
function morphSlider(frames, ticks, onArrive) {
  const box = el('div', 'morph interactive');
  const fr = el('div', 'frames'); fr.innerHTML = frames.join('');
  const frameEls = [...fr.querySelectorAll('.frame')];
  const sl = el('div', 'slider');
  const range = el('input'); range.type = 'range'; range.min = 0; range.max = 100; range.value = 0; range.setAttribute('aria-label', 'Morph');
  sl.appendChild(range);
  sl.appendChild(el('div', 'ticks', ticks.map(t => `<span>${t}</span>`).join('')));
  box.append(fr, sl);
  const last = frameEls.length - 1;
  let arrived = false;
  function paint() {
    const f = (range.value / 100) * last;
    frameEls.forEach((e, i) => {
      const d = Math.abs(f - i);
      const o = Math.max(0, 1 - d);
      e.style.opacity = o;
      e.style.transform = `scale(${0.92 + 0.08 * o})`;
    });
    if (range.value >= 100 && !arrived) { arrived = true; onArrive(); }
  }
  range.addEventListener('input', paint);
  // snap to the nearest keyframe on release so each form is seen cleanly
  range.addEventListener('change', () => {
    const target = Math.round((range.value / 100) * last) * (100 / last);
    const start = +range.value, t0 = performance.now();
    (function anim(now) {
      const k = Math.min(1, (now - t0) / 220);
      range.value = start + (target - start) * (1 - Math.pow(1 - k, 3));
      paint();
      if (k < 1) requestAnimationFrame(anim);
    })(t0);
  });
  paint();
  return box;
}

/* =====================================================================
   RENDERERS — one per step type
   ===================================================================== */
const RENDERERS = {
  scene(step, root) {
    const art = el('div', 'interactive'); art.innerHTML = ART[step.art]();
    root.appendChild(art);
    const hot = $(step.hotspot, art);
    let fired = false;
    hot.addEventListener('click', async e => {
      e.stopPropagation();
      if (fired) { sfx(step.sfx); return; }
      fired = true;
      $('.pulse', art).remove();
      const waves = $('.waves', art);
      waves.style.transition = 'opacity .4s'; waves.setAttribute('opacity', '1');
      await sfx(step.sfx);
      ui.say(step.text);
      ui.done();
    });
  },

  morph(step, root) {
    let quizBox = null;
    const slider = morphSlider(ART[step.frames](), step.ticks, async () => {
      if (step.quiz) {
        ui.say(step.quiz.text);
        quizBox.classList.remove('hidden');
      } else {
        ui.say(step.text);
        await speak(step.speak);
        ui.done();
      }
    });
    root.appendChild(slider);
    if (step.quiz) {
      const { wrap, promise } = tiles(step.quiz.options, step.quiz.answer);
      wrap.classList.add('reveal', 'hidden');
      quizBox = wrap; root.appendChild(wrap);
      promise.then(() => ui.done());
    }
  },

  compose(step, root) {
    const wrap = el('div', 'compose-wrap interactive');
    const comp = el('div', 'compose'); comp.innerHTML = ART[step.art]();
    const tile = el('div', 'drag kanji', step.part);
    wrap.append(comp, tile); root.appendChild(wrap);
    const svg = $('svg', comp), drop = $('[data-drop]', svg), base = $('[data-base]', svg), result = $('[data-result]', svg);

    let sx = 0, sy = 0, dx = 0, dy = 0, dragging = false, finished = false;
    const within = () => {
      const r = drop.getBoundingClientRect(), t = tile.getBoundingClientRect();
      const cx = t.left + t.width / 2, cy = t.top + t.height / 2, pad = 24;
      return cx > r.left - pad && cx < r.right + pad && cy > r.top - pad && cy < r.bottom + pad;
    };
    tile.addEventListener('pointerdown', e => {
      if (finished) return;
      dragging = true; tile.setPointerCapture(e.pointerId);
      tile.classList.add('lift'); tile.classList.remove('back');
      sx = e.clientX - dx; sy = e.clientY - dy;
    });
    tile.addEventListener('pointermove', e => {
      if (!dragging) return;
      dx = e.clientX - sx; dy = e.clientY - sy;
      tile.style.transform = `translate(${dx}px,${dy}px)`;
      drop.classList.toggle('hot', within());
    });
    const release = async () => {
      if (!dragging) return;
      dragging = false; tile.classList.remove('lift');
      if (within()) {
        finished = true;
        const r = drop.getBoundingClientRect(), t = tile.getBoundingClientRect();
        dx += (r.left + r.width / 2) - (t.left + t.width / 2);
        dy += (r.top + r.height / 2) - (t.top + t.height / 2);
        tile.classList.add('merge');
        tile.style.transform = `translate(${dx}px,${dy}px) scale(.62)`;
        drop.style.opacity = 0;
        await wait(420);
        base.style.opacity = 0; result.style.opacity = 1;
        ui.say(step.text);
        await wait(300);
        ui.done();
      } else {
        drop.classList.remove('hot');
        dx = dy = 0; tile.classList.add('back'); tile.style.transform = 'translate(0,0)';
      }
    };
    tile.addEventListener('pointerup', release);
    tile.addEventListener('pointercancel', release);
  },

  sound(step, root) {
    const box = el('div', 'sound interactive');
    const pair = el('div', 'pair');
    const lender = el('div', '', `<div class="big kanji">${step.lender.kanji}</div><div class="reading ok" style="text-align:center">${step.lender.reading}</div>`);
    const arrow = el('div', 'arrow', `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`);
    const target = el('div', '', `<div class="big kanji">${step.target}</div><div class="reading qmark" style="text-align:center">?</div>`);
    pair.append(lender, arrow, target);
    $('.big', lender).onclick = () => speak(step.lender.reading);
    box.appendChild(pair);
    ui.say(step.text);

    const { wrap, promise } = tiles(step.options, step.correct, {
      kana: true,
      onRight: async (t, opt) => {
        const other = step.correct.filter(c => c !== opt);
        const readingEl = $('.reading', target);
        readingEl.classList.remove('qmark'); readingEl.classList.add('ok');
        readingEl.textContent = opt;
        await speak(opt);
        for (const o of other) {
          const tile = [...wrap.querySelectorAll('.tile')].find(x => x.textContent === o);
          tile && tile.classList.add('ok2');
          readingEl.textContent += ' · ' + o;
          await speak(o);
        }
        ui.done();
      },
    });
    box.appendChild(wrap);
    root.appendChild(box);
  },

  usage(step, root) {
    const row = el('div', 'usage interactive');
    const tapped = new Set();
    step.items.forEach((item, i) => {
      const card = el('div', 'item'); card.innerHTML = ART[item.art](item.word);
      card.onclick = async () => {
        card.classList.remove('bounce'); void card.offsetWidth; card.classList.add('bounce');
        if (item.unfold) card.classList.add('open');
        if (item.text) ui.say(item.text);
        tapped.add(i);
        await speak(item.kana);
        if (tapped.size === step.items.length) ui.done();
      };
      row.appendChild(card);
    });
    root.appendChild(row);
  },

  check(step, root) {
    let k = 0;
    const runTask = async () => {
      const task = step.tasks[k];
      root.innerHTML = '';
      root.style.animation = 'none'; void root.offsetWidth; root.style.animation = '';
      ui.say(task.text);
      if (task.kind === 'listen') {
        const spk = el('button', 'speaker interactive', ART.speaker());
        spk.onclick = async () => { spk.classList.add('playing'); await speak(task.kana); spk.classList.remove('playing'); };
        root.appendChild(spk);
        setTimeout(() => spk.click(), 350);
      }
      const { wrap, promise } = tiles(shuffle(task.options), task.answer, {
        word: !!task.word || task.kind === 'listen', grid: task.options.length === 4,
        onWrong: () => { if (task.kind === 'listen') speak(task.kana); },
      });
      root.appendChild(wrap);
      await promise;
      await wait(650);
      k++;
      if (k < step.tasks.length) runTask(); else complete();
    };
    const complete = async () => {
      root.innerHTML = '';
      root.style.animation = 'none'; void root.offsetWidth; root.style.animation = '';
      const c = step.complete;
      root.appendChild(el('div', 'done-glyph kanji', c.kanji));
      root.appendChild(el('div', 'readings', c.readings.map(r => `<span class="kanji">${r}</span>`).join('')));
      ui.say(c.text);
      stepDone = true;
      nextBtn.classList.add('show', 'restart');
      nextBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>`;
      nextBtn.onclick = () => { nextBtn.innerHTML = NEXT_ICON; render(0); };
      await speak(c.readings[0]);
    };
    runTask();
  },
};

const NEXT_ICON = nextBtn.innerHTML;
if ('speechSynthesis' in window) speechSynthesis.getVoices(); // warm the voice list for the fallback
render(0);
</script>
</body>
</html>
